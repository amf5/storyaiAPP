<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <title>WebSocket STOMP Client</title>

  <!-- مكتبات SockJS و STOMP -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #messages {
      background: #f1f1f1;
      padding: 10px;
      border: 1px solid #ccc;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }

    button {
      margin-right: 10px;
      padding: 8px 16px;
      cursor: pointer;
    }

    h2 {
      color: #007bff;
    }
  </style>
</head>
<body>
  <h2>📘 WebSocket STOMP Client (With Token)</h2>

  <button onclick="connect()">Connect</button>
  <button onclick="disconnect()">Disconnect</button>

  <h3>Received Messages:</h3>
  <div id="messages"></div>

  <script>
    let stompClient = null;

    function connect() {
      const socket = new SockJS("http://localhost:8081/ws-books");
      stompClient = Stomp.over(socket);

      const token = "Bearer eyJhbGciOiJIUzI1NiJ9.eyJTdGF0dXMiOnRydWUsIlJvbGVzIjpbIlJPTEVfVVNFUiJdLCJ1c2VyTmFtZSI6IkFobWVkIGFtaW4iLCJ1c2VySWQiOjEsInN1YiI6ImFobWVkd2FsaWRhbWluNjQ4QGdtYWlsLmNvbSIsImlhdCI6MTc1MTczNzQ4NSwiZXhwIjoxNzUzODcyMjA1fQ.T-kTQXNG-E3Qb22aDkOyNXL3cXpf_GXpqBP5ERlWsW0";

      stompClient.connect(
        {
          Authorization: token
        },
        function (frame) {
          console.log("✅ Connected: " + frame);

          stompClient.subscribe("/topic/new-books", function (message) {
        	 // const book = JSON.parse(message.body); // 👈 كده تفك الـ JSON
        	  //showMessage(`📘 Title: ${book.title}, ID: ${book.id}`);
        	  showMessage(message.body);
          });
        },
        function (error) {
          console.error("❌ Connection error: ", error);
        }
      );
    }

    function disconnect() {
      if (stompClient !== null) {
        stompClient.disconnect();
        console.log("🔌 Disconnected");
      }
    }

    function showMessage(message) {
      const messagesDiv = document.getElementById("messages");
      const p = document.createElement("p");
      p.textContent = message;
      messagesDiv.appendChild(p);
    }
  </script>
</body>
</html>
